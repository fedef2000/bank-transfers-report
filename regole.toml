# Regole per assegnare in automatico nome e categoria alle transazioni.
#
# Per ogni transazione vince la prima [[regola]] il cui testo `contiene`
# compare (senza distinzione maiuscole/minuscole) nel nome, nella descrizione
# o nella controparte riportati dalla banca.
# Campi opzionali: nome, categoria, ignora = true (la transazione non viene caricata).
# Se nessuna regola assegna la categoria, si prova con il codice MCC del
# negozio (tabella [mcc] in fondo). Quello che resta vuoto lo compili dal foglio.

# Menu a tendina della colonna "Categoria" (usati quando la tab viene creata)
categorie_spese = [
    "Casa",
    "Spesa",
    "Pranzo in ufficio",
    "Cene con amici",
    "Uscite con amici",
    "Cibo fuori casa",
    "Trasporti",
    "Viaggi",
    "Vestiti",
    "Cura personale",
    "Salute",
    "Sport",
    "Hobby",
    "Abbonamenti",
    "Regali",
    "Altro",
    "Da identificare",
]
categorie_entrate = ["Stipendio", "Interessi", "Dividendi", "Rimborsi", "Regali", "Altro"]

